[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
# Private workspace (ADR-22): nothing here is published, so internal crates may
# depend on each other by path only (cargo-deny `wildcards`).
publish = false

# Workspace lint policy — authoritative for all member crates.
# Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
# Lower priority than the individual lints below (which are members of this
# group), so they can be set independently; clippy::lint_groups_priority.
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
# Curated allows for noisy pedantic lints.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
