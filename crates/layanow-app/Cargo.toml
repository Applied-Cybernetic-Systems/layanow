[package]
name = "layanow-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "layanow"
path = "src/main.rs"

[dependencies]
layanow-core = { path = "../layanow-core" }
layanow-model = { path = "../layanow-model" }
layanow-platform = { path = "../layanow-platform" }
layanow-resolvers = { path = "../layanow-resolvers" }
# egui types for the overlay UI. The windowing/host lives in `layanow-platform`
# (Wayland layer-shell on Linux, ADR-20); only the widget code lives here.
egui = { version = "0.32", default-features = false, features = ["default_fonts"] }
# Cloneable command channel: `control` hands the overlay a `Receiver` and the
# tray a cloned `Sender`.
crossbeam-channel = "0.5"
# Structured diagnostics (E4): the binary installs the subscriber; libraries
# only emit events.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Persist user settings to `~/.config/layanow/config.toml` (T-118).
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Standalone settings window (T-113+): a normal xdg_toplevel rendered portably
# with eframe/glow. ADR-31 dropped eframe for the overlay only, whose
# layer-shell requirements eframe cannot meet.
eframe = { version = "0.32", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
# Native file picker for the overlay's Context box (ADR-40). On Linux this
# talks to the xdg-desktop-portal FileChooser over D-Bus (via its own libdbus
# FFI, no GTK linked); Windows/macOS use the native dialog. The call blocks, so
# it runs on a worker thread.
rfd = "0.17"

[lints]
workspace = true
