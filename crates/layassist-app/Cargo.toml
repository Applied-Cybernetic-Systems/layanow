[package]
name = "layassist-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "layassist"
path = "src/main.rs"

[dependencies]
layassist-core = { path = "../layassist-core" }
layassist-model = { path = "../layassist-model" }
layassist-platform = { path = "../layassist-platform" }
layassist-resolvers = { path = "../layassist-resolvers" }
# egui types for the overlay UI. The windowing/host lives in `layassist-platform`
# (Wayland layer-shell on Linux, ADR-20); only the widget code lives here.
egui = { version = "0.32", default-features = false, features = ["default_fonts"] }

[lints]
workspace = true
