[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
# `paste` is a build-time proc-macro pulled in by `tokenizers`. It is flagged
# only as unmaintained (RUSTSEC-2024-0436), not vulnerable, and currently has no
# compatible replacement adopted upstream — re-evaluate when `tokenizers` drops
# or replaces it.
ignore = [
    "RUSTSEC-2024-0436",
    # `ttf-parser` is pulled in by `egui`/`epaint` (via `ab_glyph`) to parse the
    # bundled fonts. Flagged unmaintained only (RUSTSEC-2026-0192); the
    # suggested replacement (`skrifa`) is not yet adopted by epaint, and no
    # fixed version exists. Re-evaluate when epaint moves off `ab_glyph`.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # BSD Zero Clause: `recvmsg` and `doctest-file` (via `interprocess`, the
    # applet control socket).
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Root-certificate data bundled by `webpki-roots` (via `ureq`/`rustls`).
    "CDLA-Permissive-2.0",
    # Boost licence: `error-code`/`clipboard-win` (Windows clipboard, via
    # `arboard` -> `egui-winit`).
    "BSL-1.0",
    # Bundled fonts shipped by `epaint_default_fonts` (egui's `default_fonts`).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path only.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
